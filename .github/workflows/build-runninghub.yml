name: Build RunningHub Extension WAR
on:
  push:
    branches: [main, feature/runninghub-integration]
    paths:
      - "extension/**"
      - "integration/**"
      - ".github/workflows/build-runninghub.yml"
  pull_request:
    paths:
      - "extension/**"
      - "integration/**"
      - ".github/workflows/build-runninghub.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    name: Java 17 Maven and integrated website installer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: extension/pom.xml
      - name: Check website integration JavaScript
        run: |
          node --check integration/runninghub-settings.js
          node --check extension/src/main/webapp/bridge-config.js
      - name: Compile, test and package
        run: mvn -B -ntp -f extension/pom.xml clean verify
      - name: Prepare portable integration install files
        run: |
          mkdir -p build/Canvas-RunningHub-Integration
          cp extension/target/runninghub.war build/Canvas-RunningHub-Integration/
          cp integration/runninghub-settings.js build/Canvas-RunningHub-Integration/
          cp integration/install.ps1 build/Canvas-RunningHub-Integration/
          cp integration/README.md build/Canvas-RunningHub-Integration/
      - name: Upload standalone WAR
        uses: actions/upload-artifact@v4
        with:
          name: runninghub-war
          path: extension/target/runninghub.war
          if-no-files-found: error
          retention-days: 30
      - name: Upload integrated website installer
        uses: actions/upload-artifact@v4
        with:
          name: Canvas-RunningHub-Integration
          path: build/Canvas-RunningHub-Integration/
          if-no-files-found: error
          retention-days: 30

  windows-installer-smoke:
    name: Windows PowerShell 5.1 installer smoke test
    needs: test-and-package
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download actual packaged installer
        uses: actions/download-artifact@v4
        with:
          name: Canvas-RunningHub-Integration
          path: downloaded
      - name: Exercise installer with Windows PowerShell 5.1
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File integration\test-install.ps1 -PackagePath "%CD%\downloaded"
